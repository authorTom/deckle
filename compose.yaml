# Deckle - Docker Compose
#
# Production (pull the prebuilt image):
#   docker compose up -d            -> http://localhost:8080
#
# Test/dev env (live-reloading Vite server; needs a source checkout):
#   docker compose --profile dev up dev
#                                   -> http://localhost:5173
#
# Compose automatically reads a sibling ".env" file in this directory for the
# ${...} values below. Copy .env.example to .env to set a library password,
# override the port, or pin a specific image tag.
#
# By default this runs a *server library*: your notes are stored as .md files in
# the "nib-vault" volume below, so Deckle works from any device and any browser
# with nothing kept locally. The app still offers a local folder / in-browser
# library as well — you choose on first load. To turn the server library off
# entirely, set DECKLE_SERVER_LIBRARY=false in .env.

services:
  web:
    # Pull the multi-arch image published by .github/workflows/docker.yml on
    # every push to main. GHCR lowercases the owner/repo (authorTom -> authortom).
    image: ${DECKLE_IMAGE:-ghcr.io/authortom/deckle:latest}

    # --- Build from source instead of pulling (optional) -----------------
    # Requires the full repo checkout on the host. Uncomment this block and
    # run `docker compose up -d --build` to build locally rather than pull.
    # build:
    #   context: .

    ports:
      - "${DECKLE_PORT:-8080}:8080"
    init: true                 # PID 1 signal forwarding + zombie reaping
    restart: unless-stopped

    environment:
      # Store notes in the container (see the volume below). "false" turns this
      # off and makes Deckle a purely static, browser-storage app again.
      DECKLE_SERVER_LIBRARY: "${DECKLE_SERVER_LIBRARY:-true}"
      # Name shown in the app's sidebar for the server library.
      DECKLE_LIBRARY_NAME: "${DECKLE_LIBRARY_NAME:-My Notes}"
      # Password for the server library. UNSET MEANS NO PASSWORD — anyone who can
      # reach this port can read and write every note. Leave it unset only when
      # something else already guards the port (a VPN, Tailscale, or a reverse
      # proxy that authenticates).
      DECKLE_PASSWORD: "${DECKLE_PASSWORD:-}"
      # Optional: keeps sign-ins valid across restarts. Without it, a restart
      # generates a new signing key and everyone signs in again.
      DECKLE_SESSION_SECRET: "${DECKLE_SESSION_SECRET:-}"
      # Behind a reverse proxy (Caddy, Traefik, nginx)? Set "true" — or the
      # number of proxies in a chain — so sign-in throttling sees each visitor
      # rather than the proxy. Unset, X-Forwarded-For is ignored.
      DECKLE_TRUST_PROXY: "${DECKLE_TRUST_PROXY:-}"
      # Bearer tokens for the /api/v1 REST API, so an agent or script can read
      # and write the library. Blank (the default) keeps the API switched off.
      # Format: "name:scope:secret" (scope "r" or "rw"), comma-separated.
      DECKLE_API_TOKENS: "${DECKLE_API_TOKENS:-}"
      # Origins allowed to call /api/v1 from a browser. Rarely needed.
      DECKLE_API_CORS_ORIGINS: "${DECKLE_API_CORS_ORIGINS:-}"

    volumes:
      # Your notes. A named volume survives `docker compose down` and image
      # upgrades; swap in a host path (e.g. ./notes:/data) to keep the Markdown
      # files somewhere you can open in another editor or back up directly — the
      # host directory must be writable by uid 1000.
      #
      # The volume keeps its original name on purpose. Renaming it here would
      # not move anything: Compose would create a new, empty volume and serve an
      # empty library, while the notes sat in the old one.
      - nib-vault:/data

    healthcheck:
      # Array (exec) form keeps the "://" and ":8080" out of YAML's way - no
      # colon-space, no quoting gotcha. busybox wget ships in the node-alpine
      # runtime image (the Dockerfile's own HEALTHCHECK uses it too); the slim
      # image has no curl.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  # Containerised test environment: mounts the working tree and runs the Vite
  # dev server with hot reload, so no local Node install is needed. Only works
  # from a full source checkout (it bind-mounts "."), not a standalone deploy.
  dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    init: true
    volumes:
      - .:/app
      # Named volume keeps container node_modules off the host checkout.
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"

volumes:
  # Named for the app's previous name; see the mount above for why it stays.
  nib-vault:
  node_modules:
